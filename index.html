  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@4/lib/themes/dark.css">

<body>
  <div id="app"></div>
  
  <script>
    window.$docsify = {
      name: '📖 守夜者之书',
      loadSidebar: '_sidebar.md',
      loadNavbar: '_navbar.md',      // ← 新增
      loadFooter: '_footer.md',      // ← 新增
      auto2top: true,
      search: 'auto',
      copyCode: {
        buttonText: '📋 复制',
        successText: '✅ 已复制!'
      },
      subMaxLevel: 3,
      notFoundPage: true,
      maxLevel: 4,
      sidebarDisplayLevel: 1,
      pagination: {
        previousText: '← 上一篇',
        nextText: '下一篇 →',
        crossChapter: true,
        crossChapterText: true,
      },
      markdown: {
        renderer: {
          code: function(code, lang) {
            if (lang === 'mermaid') {
              return '<div class="mermaid">' + code + '</div>';
            }
            return this.origin.code.apply(this, arguments);
          }
        }
      }
    }
  </script>
