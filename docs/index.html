<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>守夜者之书</title>
    <script>
        // 检测浏览器语言，跳转到对应版本
        (function() {
            // 1. 检查 localStorage 是否有保存的语言偏好
            var savedLang = localStorage.getItem('nightkeeper-lang')
            if (savedLang === 'zh' || savedLang === 'en') {
                window.location.replace('/' + savedLang + '/')
                return
            }
            
            // 2. 检测浏览器语言
            var browserLang = navigator.language || navigator.userLanguage
            var targetLang = browserLang && browserLang.startsWith('zh') ? 'zh' : 'en'
            
            // 3. 跳转
            window.location.replace('/' + targetLang + '/')
        })()
    </script>
</head>
<body>
    <p style="text-align: center; margin-top: 100px; color: #8b949e; font-family: monospace;">
        ⏳ 正在跳转...
    </p>
</body>
</html>
